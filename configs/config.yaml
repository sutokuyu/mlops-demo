project:
  name: mlops-cat-demo
  root: .

paths:
  pictures: dataset/pictures
  videos: dataset/video
  processed: dataset/processed
  models_root: models/cat_classifier
  outputs: toilet_events
  temp_training_data: tmp_training_data

models:
  identity_detection_model_path: models/cat_identity_detection_yolo26n_4/weights/best.pt

camera:
  rtsp_url: rtsp://<username>:<password>@<ip>:<port>/h264/ch1/main/av_stream

cats:
  identity_classes:
    - bagel
    - kurumi

collect:
  confidence_threshold: 0.70
  save_interval_seconds: 0.5
  min_box_width: 80
  min_box_height: 80
  padding: 20

identity_collection:
  confidence_threshold: 0.20
  inference_interval_seconds: 5.0
  background_sample_interval_seconds: 0
  max_background_samples_per_camera: 0
  imgsz: 640
  reconnect_interval_seconds: 5.0
  output_dir: dataset/identity_detection_candidates
  cameras:
    - name: living_room
      rtsp_url: ${LIVING_ROOM_RTSP_URL:}
    - name: sofa
      rtsp_url: ${SOFA_RTSP_URL:}
    - name: feeder
      rtsp_url: ${FEEDER_RTSP_URL:}

split:
  val_ratio: 0.2
  random_seed: 42

training:
  epochs: 50
  imgsz: 640
  batch: -1
  device: 0
  project_dir: models/cat_classifier
  exist_ok: false
  identity_detection_dataset: dataset/data.yaml
  identity_detection_epochs: 50
  identity_detection_imgsz: 640
  identity_detection_batch: -1
  identity_detection_project_dir: models
  identity_detection_run_name: cat_identity_detection

monitoring:
  detection_confidence: 0.40
  interval_seconds: 0.5
  enter_window_seconds: 2.0
  enter_min_detections: 1
  no_cat_seconds: 2.0
  unknown_identity_label: UNKNOWN

notification:
  mode: discord
  mail:
    recipients:
      - example@example.com
    smtp_server: smtp.example.com
    smtp_port: 587
    smtp_username: user@example.com
    smtp_password: secret
    from_email: user@example.com
    use_tls: true
    use_ssl: false
    subject_template: "{cat_name} used the toilet"
    body_template: "A cat used the toilet. See attached image for this event."
  discord:
    webhook_url: https://discord.com/api/webhooks/WEBHOOK_ID/WEBHOOK_TOKEN
    username: "Toilet Monitor"
    avatar_url: ""
    content_template: "{cat_name} used the toilet"
