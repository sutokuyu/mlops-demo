project:
  name: mlops-cat-demo
  root: .

models:
  identity_detection_model_path: models/yolo26n_retrain_1/weights/best.pt

cats:
  identity_classes:
    - bagel
    - kurumi

identity_collection:
  confidence_threshold: 0.20
  inference_interval_seconds: 5.0
  max_images_per_camera: 10
  background_sample_interval_seconds: 0
  max_background_samples_per_camera: 0
  imgsz: 640
  reconnect_interval_seconds: 5.0
  output_dir: dataset/identity_detection_candidates
  cameras:
    - name: living_room
      rtsp_url: ${LIVING_ROOM_RTSP_URL:}
    - name: sofa
      rtsp_url: ${SOFA_RTSP_URL:}
    - name: feeder
      rtsp_url: ${FEEDER_RTSP_URL:}

# The trainer's default device. Inference picks its device from
# locations.yaml tracking.device instead, so all three runtime tools agree.
training:
  device: 0
  identity_detection_dataset: dataset/data.yaml
  identity_detection_epochs: 50
  identity_detection_imgsz: 640
  identity_detection_batch: -1
  identity_detection_project_dir: models

notification:
  discord:
    # Fallback only. The live webhooks come from .env (see configs/locations.yaml),
    # so this placeholder is used only when a caller passes no webhook of its own.
    webhook_url: https://discord.com/api/webhooks/WEBHOOK_ID/WEBHOOK_TOKEN
