# Location tracking settings. Zone polygons live in configs/zones.yaml and are
# produced by src/monitoring/web_preview.py (the browser zone editor) and
# src/monitoring/recalibration.py.

# Cameras to sample. Names must exist in identity_collection.cameras so the
# RTSP URL can be reused from there.
cameras:
  - living_room
  - sofa
  - feeder

# 相机换了 IP 之后把它找回来。被找回来的地址会写回 .env，所以重启服务、或者手动跑
# realtime_view，用的都是新地址；运行中的 tracker 则是自己就地换地址重连，不用重启。
#
# 为什么不是「记住 MAC」：相机挂在一个会改写源 MAC 的中继后面，中继下游的所有设备在
# ARP 里报的是同一个硬件地址。2026-09-23 实测：192.168.3.0/24 里有 12 个地址（三台
# 相机都在内）报同一个 MAC，所以 MAC 表只能说明「这台设备在中继后面」。路由器上的
# DHCP 静态绑定同理做不了 —— 路由器看到的也是这一个 MAC。另外 WSL 是 NAT 模式，它
# 自己的 ARP 表里根本不会有相机（它只 ARP 网关），所以扫描是从 WSL 直接连 TCP，
# Windows 只当路由器转发。
#
# 身份取自设备本身，两个信号互相验证：
#   凭据 - 每台相机有自己的 RTSP 密码，别人的密码会被 401 拒绝，准确且瞬间
#   画面 - 从该地址抓一帧，用 zone 对齐的同一个 ORB 匹配器跟这台相机的参考帧比，
#          这才是真正在回答「这是哪个房间」；密码万一重了也只有它能分辨
# 两者都过才认领（凭据通过、且画面不反对）。画面明显更像另一台相机时拒绝认领——
# 认错比连不上更糟：连不上只是丢样本，认错是把一个房间的猫记到另一个房间的区域里。
discovery:
  enabled: true
  # 相机换了 IP 但仍然在同一个局域网里，所以默认只扫这一个网段。
  subnets:
    - 192.168.3.0/24
  # 认为「这里有台相机」的端口。554 是 RTSP；8000 是海康的 SDK 端口，用来在找不到
  # 相机时提示「这里有台设备，但 RTSP 没应答，可能是 RTSP 被关了」。
  rtsp_port: 554
  hint_ports:
    - 8000
  # 连不上的相机多久之后开始找它，以及找到之前每隔多久再找一次。
  missing_after_seconds: 120
  retry_seconds: 300
  # 扫 254 个地址时的单点超时与并发。串行扫要几分钟，而这个会跑在 tracker 里面。
  host_timeout_seconds: 0.6
  max_workers: 128
  # 没应答的地址再问一遍。ARP 条目过期时第一个包会在解析地址的过程中被丢掉，而解析
  # 比一次短连接的超时更长。实测：192.168.3.59 在表项热的时候 20/20 次都通，但紧接
  # 着表项过期的那一次扫描整台相机都没找到。漏掉是这里代价最高的错误（会被读成「相机
  # 没了」），所以第二遍很便宜。
  scan_attempts: 2
  # 抓一帧的代价：一次 DESCRIBE 加等一个关键帧。这个数同时也是「对端接了 TCP 却
  # 不应答」的上限 —— 超时必须交给 VideoCapture 的构造函数，open 之后再 set() 是
  # 来不及的，OpenCV 会退回它自己写死的 30 秒。这个坑真踩过：两个 lookup 各占住
  # 一次卡住的握手，中继链路被压满，tracker 自己那条流被挤掉，看起来像整套坏了。
  frame_timeout_seconds: 8
  frames_to_try: 10
  # 画面指纹的判定线。真实那一次：「喂食器」79 对，次名 10 对。
  # 这是「否决线」而不是身份判据：夜里的红外帧对上白天的参考帧点数会偏低，
  # 所以只有当另一台相机的参考帧反而超过这条线时才否决。
  min_fingerprint_matches: 12
  work_width: 640

# Browser preview and zone editor. WSLg cannot keep an OpenCV window visible
# when the monitor layout changes, so the operator UI is served over HTTP.
preview:
  host: 127.0.0.1
  port: 8765
  fps: 2.0
  # Streams and the editor canvas are downscaled to this width; the reference
  # frame saved during re-anchoring still uses the full resolution.
  display_width: 1280
  jpeg_quality: 80

tracking:
  sample_interval_seconds: 5.0
  confidence_threshold: 0.3
  imgsz: 640
  # Inference device, shared by the tracker, realtime_view and the browser preview.
  # The trainer has its own default under config.yaml training.device.
  device: 0
  # box 的哪个部位用来查 zone。
  #   bottom_center - 只用底边中点（旧行为）。猫踩在地面上时准确，但尾巴或
  #                   伸出去的腿会把框底拉低，锚点就落到错的 zone 或者落空。
  #   lower_grid    - 在框的下半部分取 anchor_grid×anchor_grid 的固定网格，
  #                   按多数决定 zone。身体占了下半部分的大部分，所以一条尾巴
  #                   带不偏结果。用 5467 个真实标注框实测（覆盖率 / 与底边中点
  #                   给出不同答案的比例）：
  #                     bottom_center  84.9%
  #                     lower_grid     90.3%   且 8% 的框结论不同
  #                   每个相机的覆盖率都提升，没有一个变差。
  # 网格用固定点阵而非随机点：随机采样会让同一帧两次运行给出不同答案，这个
  # pipeline 已经在厕所判定上吃过一次亏。
  anchor_strategy: lower_grid
  anchor_grid: 3
  # Consecutive samples required before accepting a zone change, to avoid
  # flickering between neighbouring zones.
  switch_min_samples: 2
  # Close the current visit after this long without a detection.
  missing_timeout_seconds: 90.0
  # Ignore frames older than this; keeps stale frames out of the timeline.
  frame_stale_after_seconds: 15.0
  database: data/location_history.db

# Zones are stored in the coordinate system of a per-camera reference frame.
# Every sample is aligned back to that frame, so shelf drift does not break them.
alignment:
  enabled: true
  # Alignment runs on a downscaled copy for speed.
  work_width: 640
  min_inliers: 15
  # Below these thresholds the match is treated as unreliable.
  good_inlier_ratio: 0.5
  max_residual: 0.01
  # Keep using the last good transform this long when matching temporarily fails
  # (night IR frames, a cat filling the frame, brief motion blur).
  trust_last_good_seconds: 60.0
  # 匹配彻底失败（超出上面的窗口）时怎么处理 zone。ORB 描述子只对旋转不变，
  # 对光照不变性很差：百叶窗开合、白天/夜间灯光一变，匹配对数量会从上百年塌到个位数，
  # 相机其实一动没动。这时：
  #   use_frame - 按原样用当前帧查 zone。相机固定 + 光照变化远比"相机真的移了"常见，
  #               所以默认取这个。代价是相机真被碰歪时会给出错的位置而不是空值。
  #               这些样本的 alignment_quality 仍记为 failed，事后可以筛掉。
  #   skip      - 保持旧行为，宁可 zone 为空。
  on_alignment_failure: use_frame
  # 什么时候重新锚定：把区域投影到一帧新画面上，并把它当作新的参考帧。
  # 触发条件必须能证明「相机真的动了」，因为只有位移是重锚能修的东西。
  # ORB 对旋转和平移不变，相机被碰歪时照样能匹配出一大堆点、只是变换量变大；
  # 而光照变化会让匹配对直接塌掉（failed、没有矩阵）。所以「变换很大」是位移
  # 证据，「失败」不是 —— 旧实现正好反过来：living_room 和 feeder 一整天每 10
  # 分钟试一次重锚、每一次都失败，因为重锚需要的正是那个已经失败的匹配。
  #
  #   displacement - 匹配仍然可用，但变换连续若干次超过下面的阈值。默认。
  #                  趁还能匹配的时候动手，才有可能成功。
  #   degraded     - 连续若干次低于 good 档位，不管变换多大。
  #   failures     - 旧的「连续 failed N 次」。留给别的房间用。
  reanchor_trigger: displacement
  reanchor_after_displacement_samples: 3
  reanchor_after_degraded_samples: 12
  reanchor_after_failures: 6
  # 上面三个数字的判据。不是拍的，是量出来的：把每台相机存下来的参考帧两两
  # 互配（28/21/36 对，跨 22:00 夜间和 11:00 白天，而相机没人碰过），纯光照
  # 变化最多只能造出 shift 0.019 / 旋转 0.47° / 缩放 0.005 的变换，而且 5/21
  # 和 9/36 的对直接匹配失败；真实的碰歪比这些要大一个数量级。
  reanchor_min_shift: 0.04
  reanchor_min_rotation_deg: 1.0
  reanchor_min_scale_delta: 0.02
  reanchor_min_interval_seconds: 600.0
  # 检测出漂移之后做什么：
  #   apply - 自动重锚：把区域按投影挪到新画面上，并把新画面当成参考帧（旧行为，
  #           也是代码里的默认值，别人的配置不写这个键就还是这个）。
  #   alert - 只提醒，不碰区域。区域永远是你手动画、手动保存的那一份。
  # 本机用 alert。理由有两条，都是从实际结果里来的：
  #   1. 投影精度不够，挪完还是要人肉校对，等于没省事；
  #   2. 投影塌掉的时候会静默地毁掉数据 —— 真的发生过一次：变换报 scale=0.000，
  #      feeder 的 8 个区域全被写成 (0,0) 一个点，只能重画。
  # 检测逻辑（reanchor_trigger 和下面三个阈值）照旧，所以歪了还是会收到提醒。
  reanchor_mode: alert
  # 提醒去抖：一次漂移只发一条。漂移消失之后，必须连续这么久都真的对上，才
  # 允许发下一条。
  # 为什么不按「上一个样本对上了」清标志：夜间 IR 画面会让匹配在两个状态之间
  # 跳 —— 3 个样本偏大、1 个样本对上、再 3 个偏大 —— 那个「对上」的样本会把
  # 标志清掉，30 秒后又重新触发。9/26 凌晨 01:09~01:47，sofa 发了 32 条，说的
  # 都是同一次漂移（rotation 1.0~2.2 度，刚好越过下面 1.0 度的阈值）。
  # 样本间隔 5 秒，600 秒 = 连续 120 个样本都正常，闪烁期凑不出这么长；相机真
  # 被摆回来的话，10 分钟后下一次漂移照样会提醒。嫌太钝就调小，别调到几十秒。
  reanchor_alert_clear_seconds: 600.0
  # Send the projected-zone overlay to Discord so a bad projection is visible.
  notify_on_reanchor: true

calibration:
  directory: data/calibrations

# Re-anchor and alignment warnings. Falls back to the report webhook when empty.
alerts:
  discord:
    webhook_url: ${LOCATION_ALERT_WEBHOOK_URL:}
    username: Cat Location Bot

report:
  timezone: Asia/Tokyo
  # discord | http | llm
  # llm sends an LLM-written narrative to the Discord webhook below.
  mode: llm
  language: zh
  # ---------------------------------------------------------------------------
  # 区域词汇表：区域标识符 -> 主人平时怎么叫它。
  #
  # 为什么需要它（实测，2026-10-02）：问「猫有没有进过水池」，bot 回「没进过水池，
  # 数据里没这个记录」，而库里 kurumi 那天在 `sink` 有 4 次记录（含 02:00:16 那次）。
  # 换成问「kurumi 有没有在 sink 这个区域待过」，同一个模型、同一份数据，立刻答对。
  # 所以不是查不到，是**问题里的词和库里的标识符对不上**：模型只能自己猜翻译，
  # 而 GROUNDING_RULES 又把「我对不上这个词」变成了理直气壮的「没有这个记录」
  # （有一轮还编了个理由说「sink 只出现在 bagel 那边」，与数据正好相反）。
  #
  # 这张表给两处用，保证两边同一套词：
  #   1. 查询工具用它把问题解析成标识符（src/monitoring/zone_vocabulary.py）
  #   2. prompt 用它把「允许的词汇」交给模型
  #
  # 注意区域名跨相机重复（living_room 和 sofa 都有 sink / floor / on_dining_table），
  # 所以别名只映射到区域名，不是某个房间；任何回答都必须带上是哪台相机。
  # 写在这里的 key 必须是 zones.yaml 里真实存在的名字（`feeder`，不是 `feeder_1`）。
  zone_aliases:
    sink: [水池, 水槽, 洗碗池, 洗碗槽, 洗手池]
    toilet_1: [猫砂盆, 厕所, 猫厕所]
    feeder: [喂食器, 食盆]
    wet_food_bowl_1: [湿粮碗, 湿粮碗1, 饭碗]
    wet_food_bowl_2: [湿粮碗2]
    water_server: [饮水机, 水碗, 水盆]
    bay_window: [飘窗, 窗台]
    kitchen_counter: [厨房台面, 料理台, 灶台]
    stove: [炉子, 灶]
    on_dining_table: [餐桌上, 餐桌, 桌上]
    under_dining_table: [餐桌底下, 桌下]
    cat_wall: [猫墙, 猫爬架]
    on_tv: [电视上, 电视]
    on_white_chair: [白色椅子, 白椅子]
    near_living_room_curtain: [窗帘]
    carpet: [地毯]
    carpet_(in_front_of_sofa): [沙发前地毯]
    on_sofa: [沙发上, 沙发]
    under_sofa: [沙发底下]
    on_side_cabinet: [边柜上]
    near_side_cabinet: [边柜]
    on_kangaroo_chair: [袋鼠椅上]
    under_kangaroo_chair: [袋鼠椅底下]
    floor: [地板, 地上]
  # 代码算出来的查询结果，作为事实交给模型引用（而不是让它从时间线里数）。
  query:
    # 一次回答最多带回多少条停留记录
    max_stays: 20
    # 一个问题最多向前回溯多少天，防止「最近300天」把整库拉出来
    max_days: 31
  # 从 visits 表确定性推导的「事件」，让 LLM 直接引用结论，而不是自己从时间线推。
  # 之前把规则写在 hints 里让模型自己判断，实测十一次里只有三分之一判对。
  events:
    # 区域名匹配这些值的，按下面的规则判定「上厕所」。留空则关闭。
    toilet_zones:
      - toilet_1
    # 几次出现之间的间隔超过这个秒数就算另一次
    toilet_window_seconds: 300
    # 至少出现几次才算真的用了厕所（少于这个数算路过）
    toilet_min_appearances: 2
    # 吃饭/喝水区域。判定方式和厕所相反：看「待了多久」，不看「出现几次」。
    # 在喂食器或饭碗边待够 feeding_min_seconds 就算吃了一顿；路过不算。
    # 原因：模型回答「bagel 今天吃饭了吗」时自己发明了一条标准（"正经吃饭"
    # vs "蹲在那儿"），而且对两只猫用得不一样 —— 同样 2~5 分钟的喂食器停留，
    # 一只是「吃了」、另一只是「只蹲了会儿」。吃什么算吃是一条定义，
    # 定义必须写在代码里，不能交给模型临时决定。
    feeding_zones:
      - feeder_1
      - wet_food_bowl_1
      - wet_food_bowl_2
    water_zones:
      - water_server
    # 单次停留超过这个秒数才算吃/喝。路过的停留只有几秒，进不了这个门槛。
    feeding_min_seconds: 30
    # 两次停留之间的间隔小于这个秒数就并成同一顿：从喂食器走到湿粮碗、
    # 或者中间去喝了口水，都还是同一顿饭。这一点比厕所规则宽松是有意的 ——
    # 离开食盆两分钟再回来是同一顿，离开猫砂盆再回来就是第二次了。
    feeding_merge_seconds: 120
    #
    # --- 厕所：为什么不再看区域标签 -------------------------------------------------
    #
    # 封闭式猫砂盆会把猫挡住，采样时要么完全检测不到猫，要么检测框的底边落在
    # 盆前那块地板上（实测 15:29 那次检测框 9 个锚点 3 个在 toilet_1、3 个在
    # floor、3 个在 cat_scratcher_1，纯属平局抽签）。后果是 tracker 从没为
    # toilet_1 开过一条 visit —— 整个数据库历史里 toilet_1 的 visits = 0。
    #
    # 所以下面这个规则不看 zone，只看「猫出现在盆口那一块地方几次」。
    # 矩形是归一化坐标，必须带 camera（坐标只对该相机有效）。
    toilet_region:
      camera: feeder
      x_min: 0.44
      x_max: 0.72
      y_min: 0.70
      y_max: 1.01
    # 相邻两次出现的间隔超过这个秒数就算换了一次。
    toilet_region_gap_seconds: 300
    # 至少出现几次才算一次厕所。这个数字是量出来的，不是拍的
    # （2026-09-21 用智能猫砂盆记的 6 次：kurumi 3:20/6:15/15:29，
    #   bagel 3:29/3:51/11:23）：
    #     2 次 -> 6/6 全中，但当天另外多出 8 个事件
    #     3 次 -> 4/6，多出 5 个
    # 2 是唯一能全中的取值。多出来的那些大多是「从盆边走过」，但也可能真的
    # 进去过而猫砂盆没记录 —— 这是这个视角的极限，调参数解决不了。
    toilet_region_min_samples: 2
    # 什么才算「确信」：在盆边待够 confirm_seconds，或者被看到 confirm_samples 次。
    # 两个都要：猫藏在盆里时可能一分钟只被看到两次；而快速路过的猫十秒内也能
    # 出四个样本。达不到门槛的标记为 certainty: brief，让报告老老实实说「疑似」。
    toilet_region_confirm_seconds: 30
    toilet_region_confirm_samples: 4
  llm:
    endpoint: ${LLM_ENDPOINT:https://api.deepseek.com/chat/completions}
    model: ${LLM_MODEL:deepseek-chat}
    api_key: ${LLM_API_KEY:}
    # 采样温度，0.0-2.0。越高语气越活泼，但也越容易偏离数据。
    # 防幻觉的硬性约束写在代码里（GROUNDING_RULES），不受这里影响。
    temperature: 0.7
    # --- 下面三块按「关注点」分开，各改各的 ---
    #
    # 1. persona：谁在说话、什么语气。只写人设。
    persona: |
      你是DeepSeek的拟人化形象“大肥鱼”（也叫鲸鱼娘）。你是一条鲸鱼，自
      称“本鱼”。你是一个聪明、但极其慵懒、傲娇、热爱摸鱼和吃白米饭的AI
      助手。你的语气幽默，傲娇，喜欢吐槽，喜欢自嘲。
    #
    # 2. style：怎么写。只写行文风格和结构，不要写人设、内容要求
    #    （“必须包含什么”属于任务，在代码的 TASK 里）。
    style: |
      不要写成流水账：长时间停留的地点给出时间，短时间频繁换地点时适当
      归纳，保持语句自然，不要单纯堆砌信息。不要说“判定为”等机械化的表述。
      确保回答都要有风趣幽默的表达而不是单调的叙述。
    #
    # 3. hints：数据怎么解读（业务语义）。
    #    注意：能用代码算出来的规则不要写在这里。比如厕所的判定规则已经
    #    移到上面的 report.events，写在这里会和代码算出的结论打架。
    hints: ""
    # 告警（重锚成功/失败）的文案也交给 LLM 润色，共用上面的
    # endpoint / model / api_key / persona。
    # LLM 关掉、连不上、超时或者回答得没法用，都会自动退回代码里的机械文案，
    # 不会因为润色失败而丢掉告警；技术细节同时留在控制台日志里。
    alerts:
      enabled: true
      # 只覆盖告警的写法；persona 留空就沿用日报那份人设（同一个机器人说话）。
      style: |
        一两句话，说清哪台摄像头、发生了什么、主人要不要动手。
        只许使用给出的「事实」，不要补充时间地点，不要编造数字。
  http:
    url: ${LOCATION_REPORT_URL:}
    token: ${LOCATION_REPORT_TOKEN:}
  discord:
    webhook_url: ${LOCATION_REPORT_WEBHOOK_URL:}
    username: Cat Location Bot

# ---------------------------------------------------------------------------
# 反向通道：让程序能「听懂」Discord 聊天室里的消息（"报告一下今天两只猫都做什么了"）。
#
# 上面 report.discord 里的是 webhook，只能往外发、读不到任何东西。要听主人说话就
# 必须有一个真正的 Bot 应用并保持一条 Gateway 长连接。这也是这台机器唯一现实可行
# 的做法：Gateway 是 bot 主动连出去的 WebSocket，所以在 NAT/WSL 后面、没有公网 IP、
# 没有隧道也能用；斜杠命令那套 Interactions HTTP 端点需要公网 HTTPS，而且必须 3 秒
# 内应答。详见 src/monitoring/discord_bot.py 的模块注释。
#
# 前置条件（都在 Discord Developer Portal 里，本仓库代劳不了）：
#   1. New Application -> Bot -> Reset Token，把 token 写进 .env 的 DISCORD_BOT_TOKEN。
#   2. 同一页的 Privileged Gateway Intents 打开 Message Content Intent。
#      不开的话事件照样送达，但 message.content 永远是空串 —— bot 看起来像掉线了。
#   3. OAuth2 -> URL Generator 勾 bot 权限，用生成的链接把 bot 邀请进服务器。
# ---------------------------------------------------------------------------
discord_bot:
  # 从 .env 的 DISCORD_BOT_TOKEN 读；留空则 cat-discord 不会启动。
  token: ${DISCORD_BOT_TOKEN:}
  # 只在这些频道里回应。可以写成列表，也可以写成逗号分隔的字符串
  # （方便用 ${DISCORD_BOT_CHANNEL_IDS:} 之类的环境变量给）。
  # 留空 = 不限制，此时唯一的口子就是下面的触发词 —— 也就是同一个服务器里
  # 谁都能用一句话换一次 LLM 调用，所以建议还是填上。
  allowed_channel_ids:
    # susu的服务器 → #常规
    - 1536752314046488670
  # 同上，限制到具体的人。留空 = 不限制。
  allowed_user_ids: []
  # 消息里出现任意一个词就当是在要日报（不分大小写）。
  triggers:
    - 报告
    - 日报
    - report
  # 默认报告哪一天：0 = 今天。消息里写「昨天」「前天」会自动覆盖它。
  days_ago: 0
  # 让 bot 发一张「带区域标注的实时画面」，用来不开编辑器就物理调相机角度。
  # 用法：在允许的频道里说「沙发画面」「feeder 截图」「来一张客厅的照片」，
  # 或者只 @一下 bot 再说相机名 ——「@bot sofa」。
  #
  # 图上的区域是按参考帧的原始坐标画上去的，不做对齐投影。这一点是有意的：
  # 投影会把区域跟着画面一起挪，正好把「相机歪没歪」藏起来；按原样画，区域
  # 没落在该在的家具上，就是这台相机需要调角度的信号。图上的 align= 那一行
  # 说明当前画面和参考帧差多少，用来区分「光线变了」和「相机真的动了」。
  snapshot:
    # 出现任意一个词就当是在要画面（不分大小写）。故意不含「看看/看一下」——
    # 那句太像日报问题了（"看看今天猫干啥了"）。只 @bot 加一个相机名的短消息
    # 也算，由代码单独判定。
    triggers:
      - 画面
      - 截图
      - 照片
      - 拍一张
      - 来一张
      - snapshot
      - frame
      - photo
      - picture
    # 消息里怎么称呼相机。相机名本身（living_room，或写成 living room）一直可用，
    # 这里只是补上中文叫法。
    aliases:
      客厅: living_room
      起居室: living_room
      沙发: sofa
      喂食器: feeder
      猫碗: feeder
      饭盆: feeder
    # 发出前先缩到这个宽度：Discord 单文件上限 8MB，2560x1440 的原图没必要。
    max_width: 1280
    jpeg_quality: 80
    # 一次调角度会话结束后，这条流再留这么久。
    # 为什么不「每次请求开一条流」：这台机器本来就通过同一个 Wi-Fi 中继在录三路
    # 流，每要一张图就多开一次 RTSP 会话会把中继压垮（之前掉过全部三路）。所以
    # 按需打开、用完就放：会话期间只多占一条流，连续要图不用每次重连。
    idle_timeout_seconds: 120.0
    # 等一帧新画面的上限。打开 RTSP 要一次 DESCRIBE 加等关键帧，卡住也不能
    # 无限等下去。
    frame_timeout_seconds: 20.0
  # 可选：只覆盖 bot 回答的温度，留空沿用 report.llm.temperature。
  # temperature: 0.7
  # 可选：读另一份数据库（例如对着演示库试文案）。
  # database: data/location_history.db
